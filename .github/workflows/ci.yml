name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The xcode-27 image defaults to Xcode 27.1. Build with 27.2 (installed on
# the image), the Xcode the app is developed on, so CI compiles against the
# same SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    name: ZulipKit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - run: swift test --package-path Packages/ZulipKit

  # The generated project is committed; fail when it no longer matches
  # project.yml (someone edited one without regenerating).
  project-drift:
    name: Xcode project matches project.yml
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate
        run: xcodegen generate
      - name: Check for drift
        run: |
          git diff --exit-code Zephyr.xcodeproj ||
            { echo "::error::Zephyr.xcodeproj is out of date — run 'xcodegen generate' and commit"; exit 1; }

  build:
    name: Build (${{ matrix.name }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: visionOS Simulator
            destination: generic/platform=visionOS Simulator
          # The tvOS monitor is its own app and scheme (Makefile `tv`).
          - name: tvOS Simulator
            scheme: ZephyrTV
            destination: generic/platform=tvOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Zephyr.xcodeproj \
            -scheme '${{ matrix.scheme || 'Zephyr' }}' \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
