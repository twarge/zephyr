# XcodeGen source of truth for Zephyr.xcodeproj — regenerate with:
#   xcodegen generate
# The generated project is committed so CI needs no extra step.
name: Zephyr
options:
  createIntermediateGroups: true

packages:
  ZulipKit:
    path: Packages/ZulipKit

targets:
  Zephyr:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Zephyr
      - Shared
    dependencies:
      - package: ZulipKit
        products: [ZulipModel, ZulipAPI, ZulipContent, ZulipMath]
      - target: ZephyrWidgets
        embed: true
      - target: ZephyrShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.zephyr
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 257KW9ZJFP
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Zephyr/Zephyr.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Support/Zephyr-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Support/Zephyr-iOS.entitlements
        # Set by Xcode's App Groups capability; kept so regeneration
        # preserves provisioning behavior.
        REGISTER_APP_GROUPS: YES
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys; carries NSUserActivityTypes.
        INFOPLIST_FILE: Support/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Twarge. Apache-2.0."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ZephyrWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Extensions/Widgets
      - Shared
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Zephyr Unreads
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.zephyr.widgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 257KW9ZJFP
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Support/Widgets-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Support/Widgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Support/Widgets-iOS.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        # No MainActor-default here: TimelineProvider's requirements are
        # nonisolated and the widget has no shared mutable state.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        REGISTER_APP_GROUPS: YES

  ZephyrShare:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Extensions/Share
      - Shared
    info:
      path: Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Zephyr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 4
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.zephyr.share
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 257KW9ZJFP
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Support/Widgets-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Support/Widgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Support/Widgets-iOS.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        REGISTER_APP_GROUPS: YES

schemes:
  Zephyr:
    build:
      targets:
        Zephyr: all
    run:
      config: Debug
    archive:
      config: Release
